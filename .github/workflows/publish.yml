name: Publish NuGet package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, for example 0.4.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Resolve package version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          else {
            $version = $env:MANUAL_VERSION
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid package version '$version'."
          }

          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Publishing SnapData $version"

      - name: Restore
        run: dotnet restore SnapData.slnx

      - name: Test
        run: >
          dotnet test SnapData.slnx
          --configuration Release
          --no-restore
          -p:Version=$env:PACKAGE_VERSION

      - name: Pack release set
        shell: pwsh
        run: |
          $projects = @(
            "src/SnapData/SnapData.csproj",
            "src/SnapData.Schema/SnapData.Schema.csproj",
            "src/SnapData.Migrations/SnapData.Migrations.csproj",
            "src/SnapData.Migrations.Cli/SnapData.Migrations.Cli.csproj"
          )

          foreach ($project in $projects) {
            dotnet pack $project `
              --configuration Release `
              --no-build `
              --no-restore `
              --output artifacts/packages `
              -p:Version=$env:PACKAGE_VERSION

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Verify packages and tool installation
        shell: pwsh
        run: >
          ./eng/verify-packages.ps1
          -Version $env:PACKAGE_VERSION
          -PackageDirectory artifacts/packages
          -ToolDirectory artifacts/tool-smoke

      - name: Log in to NuGet.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path artifacts/packages -Filter *.nupkg
          if ($packages.Count -eq 0) {
            throw "No NuGet packages were found in the artifacts directory."
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source "https://api.nuget.org/v3/index.json" `
              --skip-duplicate

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
