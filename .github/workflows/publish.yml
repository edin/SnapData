name: Publish NuGet package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SnapData.slnx

      - name: Test
        run: dotnet test SnapData.slnx --configuration Release --no-restore

      - name: Pack
        run: >
          dotnet pack src/SnapData/SnapData.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts

      - name: Log in to NuGet.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path artifacts -Filter *.nupkg
          if ($packages.Count -eq 0) {
            throw "No NuGet packages were found in the artifacts directory."
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source "https://api.nuget.org/v3/index.json" `
              --skip-duplicate

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
